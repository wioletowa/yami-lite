[package]
name = "yami-lite"
version = "0.1.0"
edition = "2021"
description = "A personal, single-binary cut of the yami pixel shell for niri"
keywords = ["wayland", "niri", "shell", "layer-shell", "desktop"]
categories = ["gui"]
license = "MIT"

[[bin]]
name = "yami-lite"
path = "src/main.rs"

[dependencies]
yami-px = { path = "px" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# буфер обмена: zwlr-data-control у композиторов без ext-data-control (тот же крейт, что тянет sctk)
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# blocking 1.7 keeps idle pool threads forever, each waking twice a second (zbus closes sockets
# and reads peer credentials there); 1.6 lets them exit after 500 ms idle
blocking = "=1.6.2"
libc = "0.2"

# модули по выбору (install.sh --fan --wallhaven …); без фич — только ядро
[features]
default = []
fan = []
wallhaven = []
desktop = []
recolor = []
privacy = []
visualizer = []
clipboard = []
full = ["fan", "wallhaven", "desktop", "recolor", "privacy", "visualizer", "clipboard"]

[workspace]
members = ["px"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
